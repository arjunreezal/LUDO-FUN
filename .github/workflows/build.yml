name: Build LUDO

# Builds the Android APK and an unsigned iPhone IPA in the cloud, so neither
# needs to be compiled on your Windows PC. Run it from the Actions tab
# ("Run workflow"), or push to main. Pushing a tag such as v1.0.0 also
# publishes both files on a GitHub Release page for easy phone downloads.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: flutter create . --org com.arjunrijal --project-name ludo --platforms android,ios,web
      - name: Apply LUDO name, icons and launch screen
        run: python3 tool/configure_platforms.py
      - name: Set up release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No signing secrets found. The APK is signed with a temporary key; uninstall the previous build before installing a new one. See docs/BUILD_AND_INSTALL.md."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          echo "Release signing configured."
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Name the APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/LUDO-${VERSION}-build${{ github.run_number }}.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: LUDO-android-apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iPhone IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: flutter create . --org com.arjunrijal --project-name ludo --platforms android,ios,web
      - name: Apply LUDO name, icons and launch screen
        run: python3 tool/configure_platforms.py
      - name: Build the iOS app without code signing
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Package as an unsigned IPA
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -qry "LUDO-${VERSION}-build${{ github.run_number }}-unsigned.ipa" Payload
          rm -rf Payload
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: LUDO-ios-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error

  release:
    name: Publish release files
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
